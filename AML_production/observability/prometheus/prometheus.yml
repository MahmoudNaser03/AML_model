global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aml-api
    metrics_path: /metrics
    static_configs:
      - targets: [ray-serve:8000]

  # Ray's dashboard publishes every node metrics-agent address. Unlike the
  # load-balanced FastAPI endpoint, these targets expose all Serve replicas
  # with stable application/deployment/replica labels.
  - job_name: ray
    scrape_interval: 2s
    http_sd_configs:
      - url: http://ray-serve:8265/api/prometheus/sd
        refresh_interval: 5s
