name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  production-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AML_production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AML_production/requirements.txt
            AML_production/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q
